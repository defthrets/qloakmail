## QloakMail Dovecot main config — IMAP only.
##
## Mail is stored already-encrypted by the encrypt-pipe (RFC 3156
## multipart/encrypted PGP envelopes). Dovecot serves the blobs as-is;
## decryption happens in the user's browser.
##
## We do NOT enable the mail_crypt plugin — the encrypt-pipe has already
## done the work, and mail_crypt would only re-encrypt to its own keys
## (which would defeat zero-access since dovecot would hold them).

protocols = imap lmtp

mail_location = maildir:/var/mail/%d/%n/Maildir

# Users live in PostgreSQL (read-only — Dovecot only authenticates IMAP
# clients; webmail users have a separate session model).
passdb {
  driver = sql
  args   = /etc/dovecot/conf.d/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args   = /etc/dovecot/conf.d/dovecot-sql.conf.ext
}

# Static system uid/gid for all mailboxes.
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid  = 5000

# IMAP / LMTP services.
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# Audit v3 (L1): require TLS for every IMAP session. ssl=required means
# port 143 still listens (RFC 3501 compliance) but the only commands
# accepted in plaintext are STARTTLS, NOOP, CAPABILITY, LOGOUT — AUTH
# is refused until the client upgrades. Port 993 (implicit TLS) is the
# preferred entry point either way.
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/dovecot/ssl/cert.pem
ssl_key  = </etc/dovecot/ssl/key.pem

# Logging
log_path = /dev/stderr
auth_verbose = yes

# Brute-force friction — failed-auth attempts wait 5s before
# responding. Without an external fail2ban (mail logs don't reach
# the host because we're in Docker), this is dovecot's own rate
# limiter at the protocol layer. Default is 2s; 5s makes pipelined
# password-spray noticeably slower.
auth_failure_delay = 5s

# IMAP behaviour
mail_plugins = $mail_plugins
# Hand-in-hand with ssl=required above: refuse plaintext AUTH from
# anywhere except the loopback interface. External IMAP clients on
# :143 must STARTTLS before LOGIN/AUTHENTICATE will respond.
disable_plaintext_auth = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
}
