# QloakMail - zero-access encrypted email
# Single-host stack. All services on internal "voidnet" network;
# only nginx, postfix and dovecot expose ports to the host.

# Cap docker log retention so request/connection logs don't accumulate
# indefinitely on disk. 10 MB x 3 files = 30 MB max per container.
# Anything older is dropped.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Security defaults applied to every service. no-new-privileges blocks
# setuid escalation post-exec — defence against an attacker who lands
# RCE in any container trying to elevate to root.
x-security: &default-security
  security_opt:
    - "no-new-privileges:true"

networks:
  voidnet:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mailstore:
  rspamd-data:
  certs:
  tor-keys:

services:

  postgres:
    <<: *default-security
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    logging: *default-logging
    networks: [voidnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *default-security
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    cap_drop: [ALL]
    cap_add:
      # CHOWN + FOWNER + DAC_OVERRIDE: the redis docker entrypoint
      # chowns /data on startup so the redis user can write the AOF.
      # Without these the recursive chown silently fails, find returns
      # "Permission denied", and redis-server can't open the appendonly
      # file. SETUID/SETGID for the gosu drop from root to redis.
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - redis-data:/data
    logging: *default-logging
    networks: [voidnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *default-security
    build: ./api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mailstore:/var/mail
      # Read-only mount so the API can publish the .onion address to the
      # SPA at /api/v1/config. Tor writes the hostname file here on first
      # bootstrap; the API just reads it.
      - tor-keys:/var/lib/tor:ro
    logging: *default-logging
    networks: [voidnet]
    # Exposed via nginx; uncomment the next line for direct dev access.
    ports:
      - "127.0.0.1:8000:8000"

  encrypt-pipe:
    <<: *default-security
    build:
      context: ./postfix
      dockerfile: Dockerfile.pipe
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    env_file: .env
    depends_on:
      - api
    volumes:
      - mailstore:/var/mail
    logging: *default-logging
    networks: [voidnet]

  postfix:
    # Postfix's master process model relies on a complex set of
    # capabilities (NET_BIND_SERVICE for :25/:587, SETUID/SETGID for
    # the per-component privilege drops, CHOWN/DAC_* for queue
    # directories). Aggressive read_only / cap_drop ALL would break
    # it. Keeping no-new-privileges and the cap allowlist; full
    # filesystem read-only intentionally not enabled.
    <<: *default-security
    build: ./postfix
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_RESOURCE
    hostname: ${VOIDMAIL_HOSTNAME}
    env_file: .env
    depends_on:
      - encrypt-pipe
      - rspamd
    volumes:
      - ./postfix/opendkim/keys:/etc/opendkim/keys
      - ./postfix/header_checks.pcre:/etc/postfix/header_checks.pcre:ro
      - certs:/etc/letsencrypt:ro
    ports:
      - "25:25"
      - "587:587"
    logging: *default-logging
    networks: [voidnet]

  dovecot:
    # Same caveat as postfix — dovecot has its own setuid model.
    <<: *default-security
    build: ./dovecot
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    env_file: .env
    volumes:
      - mailstore:/var/mail
      - certs:/etc/letsencrypt:ro
    ports:
      - "143:143"
      - "993:993"
    logging: *default-logging
    networks: [voidnet]

  rspamd:
    <<: *default-security
    build: ./rspamd
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      # rspamd's entrypoint chowns /var/log/rspamd to the _rspamd user
      # before forking workers. Without CHOWN+FOWNER+DAC_OVERRIDE the
      # log file open fails and the process exits.
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    env_file: .env
    volumes:
      - rspamd-data:/var/lib/rspamd
    logging: *default-logging
    networks: [voidnet]

  web:
    <<: *default-security
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./web:/usr/share/nginx/html:ro
    logging: *default-logging
    networks: [voidnet]

  nginx:
    # read_only intentionally NOT set: the entrypoint renders the
    # config template into /etc/nginx/conf.d/voidmail.conf and creates
    # /var/www/certbot at startup. Refactoring to render into /tmp
    # with an include would let us turn this on; tracked as a future
    # cleanup. cap_drop + no-new-privileges still apply.
    <<: *default-security
    build: ./nginx
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    env_file: .env
    depends_on:
      - api
      - web
    volumes:
      - certs:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"      # plain HTTP dev port
    logging: *default-logging
    networks: [voidnet]

  # Tor hidden service — exposes the webmail at a v3 .onion address so
  # users never reveal their clearnet IP to us. The keys persist in the
  # tor-keys volume so the address is stable across redeploys; back that
  # volume up if you want to keep the same .onion forever.
  tor:
    <<: *default-security
    build: ./tor
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - SETGID
      - SETUID
    depends_on:
      - nginx
    volumes:
      - tor-keys:/var/lib/tor
    logging: *default-logging
    networks: [voidnet]

  # Optional: certbot for Let's Encrypt issuance/renewal.
  # Run on demand with `docker compose run --rm certbot ...`
  certbot:
    <<: *default-security
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certs:/etc/letsencrypt
    entrypoint: ["sh", "-c"]
    command: ["echo 'use: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d $${VOIDMAIL_DOMAIN}'"]
