# DKIM signing on outbound mail. Audit v2 (M1) — previously absent,
# which broke DMARC strict-mode for anyone we send to. Keys live in the
# rspamd-data docker volume at /var/lib/rspamd/dkim/<domain>/<selector>.key
# Generate them with:  ./scripts/generate-dkim.sh qloak.me mail
# That script also prints the TXT record to publish at the registrar.
#
# Until the TXT is live and the key is on-disk, this module is a no-op
# (rspamd logs "no key found, skipping" but won't reject mail).

allow_username_mismatch = true;
allow_hdrfrom_mismatch = true;
sign_authenticated = true;
sign_local = true;
use_domain = "header";
use_redis = false;
use_esld = true;

# Selector used when generating + publishing the TXT record.
selector = "mail";

# Per-domain key file resolved as:
#   path = "${rundir}/dkim/${domain}/${selector}.key"
# The ${rundir} variable expands to /var/lib/rspamd inside the container,
# which is the persistent volume mount declared in docker-compose.yml.
path = "/var/lib/rspamd/dkim/$domain/$selector.key";

# Sign mail FROM our domains. The list is short enough to hardcode;
# add more here when we accept additional inbound domains.
domain {
    "qloak.me" {
        selector = "mail";
        path = "/var/lib/rspamd/dkim/qloak.me/mail.key";
    }
}
