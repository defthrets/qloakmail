# Outbound rate limiting per VoidMail account.
# Authenticated submission only (Postfix's submission service marks
# Rspamd milter calls with mail_addr / auth_authen). For unauthenticated
# inbound mail no rate limit applies here — Postfix anvil_rate_limit
# handles connection-level limits.

rates {
    # Per authenticated user.
    user_hour      = "50 / 1h";
    user_day       = "200 / 1d";
    user_hardcap   = "1000 / 1d";
    # Per source IP (for anti-bursts on submission).
    ip_hour        = "200 / 1h";
}

whitelisted_user = [];
